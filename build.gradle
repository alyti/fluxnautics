plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.141'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

configurations {
    localRuntime {
        canBeResolved = true
        canBeConsumed = false
    }
}

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    validateAccessTransformers = true

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()
            gameDirectory.set(file('run/client'))

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            gameDirectory.set(file('run/server'))
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            gameDirectory.set(file('run/gameTestServer'))
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            gameDirectory.set(file('run/data'))
            programArguments.addAll('--mod', project.mod_id)
            programArguments.addAll('--all')
            programArguments.addAll('--output', file('src/generated/resources/').getAbsolutePath())
            programArguments.addAll('--existing', file('src/main/resources/').getAbsolutePath())

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
//            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG

            systemProperty "guideme.${project.mod_id}.guide.sources", file("guidebook").absolutePath
            systemProperty "guideme.${project.mod_id}.guide.sourcesNamespace", project.mod_id
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }


    parchment {
        minecraftVersion = "${minecraft_version}"
        mappingsVersion = "${parchment_version}"
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }
configurations.runtimeClasspath.extendsFrom(configurations.localRuntime)

repositories {
    mavenLocal()

    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com"
    }

    maven {
        name = "createmod Maven"
        url = "https://maven.createmod.net/"
    }

    maven {
        name = "Ryan's Public Maven"
        url = "https://maven.ryanhcode.dev/releases/"
    }

    maven { url = "https://mvn.devos.one/snapshots" }
    maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven/" }

    maven {
        url = "https://maven.squiddev.cc"
        content {
            includeGroup("cc.tweaked")
        }
    }

    maven { url 'https://modmaven.dev/' } // Mekanism
    maven { url = "https://api.modrinth.com/maven" }

    maven {
        url "https://chocolateminecraft.com/maven"
        name "Xaero's Maven"
    }

    maven { url = "https://maven.bawnorton.com/releases" }

    // Mirror
    maven { url = "https://maven.enjarai.dev/mirrors" }
}

dependencies {
    compileOnly(project(':annotation-processor'))
    runtimeOnly(project(':annotation-processor'))
    annotationProcessor(project(':annotation-processor'))

    compileOnly(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-common:0.3.7"))
    implementation(jarJar("com.github.bawnorton.mixinsquared:mixinsquared-neoforge:0.3.7"))

    implementation("foundry.imguimc:imguimc-neoforge-${project.minecraft_version}:${project.imguimc_version}")
    def veil = "foundry.veil:veil-neoforge-${minecraft_version}:${veil_version}"
    compileOnly(veil)
    implementation(veil) {
        exclude group: 'maven.modrinth'
        exclude group: 'me.fallenbreath'
    }

    def flywheelApi = "dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}"
    compileOnly(flywheelApi)

    def flywheel = "dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"
    implementation(flywheel)

    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'foundry.veil'
    }
    api("dev.ryanhcode.sable-companion:sable-companion-common-${minecraft_version}:${sable_companion_version}")

    implementation("mekanism:Mekanism:${minecraft_version}-$mekanism_version")

    compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-core-api:$computercraft_tweaked_version")
    compileOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge-api:$computercraft_tweaked_version")
    runtimeOnly("cc.tweaked:cc-tweaked-$minecraft_version-forge:$computercraft_tweaked_version")

    implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
    localRuntime("com.tterrag.registrate:Registrate:${registrate_version}")
    localRuntime("maven.modrinth:jade:${jade_version}+neoforge")
    localRuntime("xaero.map:xaeroworldmap-neoforge-${minecraft_version}:${xaeroworldmap_version}")

    implementation("dev.simulated_team.simulated:simulated-common-1.21.1:1.3.1") { transitive = false }

//    jarJar(implementation("maven.modrinth:fancytabsections:5.0-NEOFORGE-1.21.1"))

    compileOnly "org.appliedenergistics:guideme:${guideme_version}:api"
    runtimeOnly "org.appliedenergistics:guideme:${guideme_version}"

//    implementation(files("libs/hologenica-1.0.2-neoforge-1.21.1.jar"))
    // Example mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-forge-api:${jei_version}"
    // runtimeOnly "mezz.jei:jei-${mc_version}-forge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// --- Mod Directory Syncing ---
// This block copies mods from the shared 'run/mods' folder into the specific
// 'run/client/mods', 'run/server/mods', and 'run/gameTestServer/mods' folders
// so that client-only mods and server-only mods don't cross-contaminate.
def sharedModsDir = file('run/mods')

def copySharedModsToClient = tasks.register('copySharedModsToClient', Copy) {
    from(sharedModsDir)
    into('run/client/mods')
    include('*.jar')
}

def copySharedModsToServer = tasks.register('copySharedModsToServer', Copy) {
    from(sharedModsDir)
    into('run/server/mods')
    include('*.jar')
}

def copySharedModsToGameTestServer = tasks.register('copySharedModsToGameTestServer', Copy) {
    from(sharedModsDir)
    into('run/gameTestServer/mods')
    include('*.jar')
}

// Ensure the mods are synced when importing the project into an IDE
neoForge.ideSyncTask copySharedModsToClient
neoForge.ideSyncTask copySharedModsToServer
neoForge.ideSyncTask copySharedModsToGameTestServer

// Ensure the mods are synced before running via Gradle tasks
project.afterEvaluate {
    tasks.named('runClient').configure { dependsOn('copySharedModsToClient') }
    tasks.named('runServer').configure { dependsOn('copySharedModsToServer') }
    tasks.named('runGameTestServer').configure { dependsOn('copySharedModsToGameTestServer') }
}
// -------------------------------

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description,
                             sable_version          : sable_version,
                             mekanism_version_range : mekanism_version_range,
                             guideme_version        : guideme_version,]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

tasks.named('processResources', ProcessResources) {
    from('guidebook') {
        into("assets/${project.mod_id}/guides/${project.mod_id}/guide")
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-AmekanismModule=fluxnautics")
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}